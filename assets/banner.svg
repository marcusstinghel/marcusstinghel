<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Hi, I'm Marcus. Fullstack developer, C#/.NET and Python">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.55" stop-color="#1a1f4b"/>
      <stop offset="1" stop-color="#3b2a6b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.35">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dcfff"/>
      <stop offset="0.5" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#7aa2f7"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7aa2f7" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" fill="url(#sky)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  <rect width="1200" height="400" fill="url(#glow)"/>

  <!-- stars -->
  <g fill="#c0caf5">
    <circle cx="80" cy="50" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="110" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="40" r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="80" r="1"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="30" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="120" r="1"/>
    <circle cx="1010" cy="60" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="140" r="1"/>
    <circle cx="1160" cy="40" r="1.5"><animate attributeName="opacity" values="1;0.3;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="190" r="1"/>
    <circle cx="450" cy="160" r="1"/>
  </g>

  <!-- code window -->
  <g transform="translate(760 95)">
    <rect width="360" height="190" rx="12" fill="#16161e" fill-opacity="0.9" stroke="#7aa2f7" stroke-opacity="0.35"/>
    <circle cx="22" cy="20" r="6" fill="#f7768e"/>
    <circle cx="42" cy="20" r="6" fill="#e0af68"/>
    <circle cx="62" cy="20" r="6" fill="#9ece6a"/>
    <g font-family="Consolas, 'Courier New', monospace" font-size="16">
      <text x="22" y="66"><tspan fill="#bb9af7">public record</tspan><tspan fill="#7dcfff"> Dev</tspan><tspan fill="#c0caf5">(</tspan></text>
      <text x="44" y="94"><tspan fill="#9ece6a">"Marcus"</tspan><tspan fill="#c0caf5">,</tspan></text>
      <text x="44" y="122"><tspan fill="#c0caf5">[</tspan><tspan fill="#9ece6a">"C#"</tspan><tspan fill="#c0caf5">, </tspan><tspan fill="#9ece6a">".NET"</tspan><tspan fill="#c0caf5">, </tspan><tspan fill="#9ece6a">"Python"</tspan><tspan fill="#c0caf5">],</tspan></text>
      <text x="44" y="150"><tspan fill="#9ece6a">"Fullstack"</tspan><tspan fill="#c0caf5">);</tspan></text>
      <text x="22" y="176" fill="#565f89">// payments · integrations · AI agents</text>
    </g>
    <rect x="200" y="137" width="9" height="17" fill="#c0caf5"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
  </g>

  <!-- skyline / hills -->
  <path d="M0 330 L90 290 L170 315 L260 270 L360 305 L450 280 L560 320 L660 285 L760 318 L880 292 L990 325 L1100 295 L1200 318 V400 H0Z" fill="#24283b"/>
  <path d="M0 360 L120 335 L240 352 L380 330 L520 356 L660 338 L820 360 L960 340 L1100 358 L1200 345 V400 H0Z" fill="#1a1b26"/>

  <!-- title -->
  <g font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="80" y="170" font-size="60" font-weight="700" fill="url(#title)">Hi, I'm Marcus</text>
    <text x="82" y="218" font-size="26" fill="#c0caf5">Fullstack Developer · C#/.NET &amp; Python</text>
    <text x="82" y="256" font-size="18" fill="#a9b1d6" fill-opacity="0.85">Payments · Integrations · Cross-platform apps · AI agents</text>
  </g>
</svg>
